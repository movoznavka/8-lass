<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Уроки · 8 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCE9D0;
    --bg-soft:#FCF2E4;
    --card:#FFFFFF;
    --ink:#3B2313;
    --ink-soft:#A0785F;
    --line: rgba(59,35,19,0.08);

    --c1-a:#FFB35F; --c1-b:#EE7A33; --c1-sh: rgba(238,122,51,0.45);
    --c3-a:#5FE0A8; --c3-b:#17A863; --c3-sh: rgba(23,168,99,0.4);
    --c2-b:#E5484D;

    --correct-bg:#E6F8EE;
    --correct-ink:#128A54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 64px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:22px;
    border-bottom:1.5px solid rgba(59,35,19,0.14);
  }
  .kicker{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
  }
  .kicker.tag{opacity:.4;}

  h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}
  .sub{color:var(--ink-soft);font-size:15px;max-width:60ch;margin:0 0 30px;font-weight:500;}

  .searchbox{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border-radius:16px;
    padding:12px 16px;
    margin-bottom:34px;
    box-shadow: 0 14px 30px -24px rgba(59,35,19,0.35);
  }
  .searchbox svg{flex:none;opacity:.4;}
  .searchbox input{
    border:none;outline:none;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    width:100%;
    background:transparent;
  }
  .searchbox input::placeholder{color:var(--ink-soft);}

  .block{
    margin-bottom:46px;
  }
  .block-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:-0.01em;
    margin:0 0 4px;
    padding-bottom:12px;
    border-bottom:2px solid rgba(59,35,19,0.14);
  }

  .subgroup{ margin-bottom:26px; margin-top:24px; }
  .subgroup:first-of-type{ margin-top:22px; }
  .subgroup-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--c1-b);
    margin:0 0 14px 2px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 14px 5px 12px;
    border-radius:999px;
    background: rgba(238,122,51,0.10);
  }
  .subgroup-title::before{
    content:'';
    width:6px;height:6px;
    border-radius:50%;
    background:var(--c1-b);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:14px;
  }

  .card{
    background:var(--card);
    border-radius:22px;
    padding:22px 22px 20px;
    box-shadow: 0 14px 30px -24px rgba(59,35,19,0.35);
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card.ready:hover{
    transform:translateY(-3px);
    box-shadow: 0 18px 34px -18px rgba(59,35,19,0.4);
  }
  .card.soon{
    opacity:.5;
    cursor:default;
    pointer-events:none;
  }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }

  .tile{
    width:40px;height:40px;min-width:40px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:14px;
    color:var(--c1-b);
    background: linear-gradient(150deg, rgba(255,255,255,0.75), rgba(255,179,95,0.28));
    backdrop-filter: blur(6px) saturate(160%);
    -webkit-backdrop-filter: blur(6px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 12px -7px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.8);
  }

  .status{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .status.ready{background:var(--correct-bg);color:var(--correct-ink);}
  .status.soon{background:var(--bg-soft);color:var(--ink-soft);}

  .card-title{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:16.5px;
    line-height:1.32;
    margin:0;
  }
  .card-sub{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    margin:0;
  }

  .card.hidden{ display:none; }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="kicker">Навігація</div>
    <div class="kicker tag">8 клас</div>
  </div>

  <h1>Усі <span class="hl">уроки</span></h1>
  <p class="sub">Ця сторінка — лише для вас. Відкрийте потрібну тему, щоб пояснювати матеріал і малювати прямо на екрані.</p>

  <div class="searchbox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Пошук теми…">
  </div>

  <div id="blocks"></div>

  <footer>@movoznavka</footer>
</div>

<script>
/* ============================================================
   ЯК ДОДАТИ НОВИЙ УРОК ЧИ ТЕМУ
   Весь список живе в масиві BLOCKS нижче — block (розділ) →
   subgroups (підрозділи; title: null — якщо підрозділ без назви)
   → items (самі картки).

   Щоб додати картку — скопіюй один блок { ... } всередині items
   і зміни icon / status / title / desc / href.
   status: "ready" — картка активна, клікабельна, зелений бейдж "Готово"
           "soon"  — картка неактивна, сірий бейдж "Скоро"
   href повинен бути ПОВНИМ посиланням (https://...).
   ============================================================ */

const BLOCKS = [
  {
    name: "Повторення та узагальнення вивченого",
    subgroups: [
      { title: null, items: [
        {icon: "С", status: "ready", title: "Самостійні частини мови", href: "urok-1-samostijni-chastyny-movy.html"},
        {icon: "Д", status: "ready", title: "Дієслово та його форми", href: "urok-diyeslovo-formy.html"},
        {icon: "Р", status: "soon", title: "Розряди прислівників за значенням", href: "urok-pryslivnyky-rozryady.html"},
        {icon: "П", status: "soon", title: "Правопис прислівників", href: "urok-pryslivnyky-pravopys.html"},
        {icon: "С", status: "soon", title: "Службові частини мови", href: "urok-sluzhbovi-chastyny-movy.html"},
        {icon: "П", status: "soon", title: "Правопис службових частин мови", href: "urok-sluzhbovi-pravopys.html"},
        {icon: "Г", status: "soon", title: "Граматичні помилки", href: "urok-hramatychni-pomylky.html"}
      ]}
    ]
  },
  {
    name: "Синтаксис. Пунктуація",
    subgroups: [
      { title: "Словосполучення і речення", items: [
        {icon: "С", status: "soon", title: "Словосполучення", href: "urok-slovospoluchennya.html"},
        {icon: "Г", status: "soon", title: "Граматична помилка в словосполученні", href: "urok-hram-pomylka-slovospoluchennya.html"},
        {icon: "Р", status: "soon", title: "Речення", href: "urok-rechennya.html"},
        {icon: "П", status: "soon", title: "Підмет", href: "urok-pidmet.html"},
        {icon: "П", status: "soon", title: "Присудок. Простий і складений дієслівний присудок", href: "urok-prysudok-diyeslivnyi.html"},
        {icon: "С", status: "soon", title: "Складений іменний присудок", href: "urok-prysudok-imennyi.html"},
        {icon: "У", status: "soon", title: "Узгодження головних членів речення", href: "urok-uzgodzhennya-holovnyh-chleniv.html"},
        {icon: "Т", status: "soon", title: "Тире між підметом і присудком", href: "urok-tyre-pidmet-prysudok.html"},
        {icon: "У", status: "soon", title: "Узагальнення: «Словосполучення і речення»", href: "urok-uzagalnennya-slovospoluchennya-rechennya.html"}
      ]},
      { title: "Другорядні члени речення", items: [
        {icon: "О", status: "soon", title: "Означення", href: "urok-oznachennya.html"},
        {icon: "П", status: "soon", title: "Прикладка як різновид означення", href: "urok-prykladka.html"},
        {icon: "Н", status: "soon", title: "Написання прикладок", href: "urok-napysannya-prykladok.html"},
        {icon: "Д", status: "soon", title: "Додаток", href: "urok-dodatok.html"},
        {icon: "О", status: "soon", title: "Обставина", href: "urok-obstavyna.html"},
        {icon: "П", status: "soon", title: "Порівняльний зворот", href: "urok-porivnyalnyi-zvorot.html"},
        {icon: "П", status: "soon", title: "Порядок слів у реченні. Логічний наголос", href: "urok-poryadok-sliv.html"},
        {icon: "У", status: "soon", title: "Узагальнення: «Другорядні члени речення»", href: "urok-uzagalnennya-druhoryadni-chleny.html"}
      ]},
      { title: "Односкладне речення. Повне і неповне речення", items: [
        {icon: "О", status: "soon", title: "Односкладні речення", href: "urok-odnoskladni-rechennya.html"},
        {icon: "О", status: "soon", title: "Означено-особові та неозначено-особові речення", href: "urok-oznacheno-osobovi.html"},
        {icon: "У", status: "soon", title: "Узагальнено-особові речення", href: "urok-uzagalneno-osobovi.html"},
        {icon: "Б", status: "soon", title: "Безособові речення", href: "urok-bezosobovi.html"},
        {icon: "Н", status: "soon", title: "Називні речення", href: "urok-nazyvni.html"},
        {icon: "П", status: "soon", title: "Повні і неповні речення", href: "urok-povni-nepovni.html"},
        {icon: "У", status: "soon", title: "Узагальнення: «Односкладне речення. Повне і неповне речення»", href: "urok-uzagalnennya-odnoskladni.html"}
      ]},
      { title: "Речення з однорідними членами", items: [
        {icon: "О", status: "soon", title: "Однорідні члени речення", href: "urok-odnoridni-chleny.html"},
        {icon: "К", status: "soon", title: "Кома між однорідними членами речення", href: "urok-koma-odnoridni.html"},
        {icon: "О", status: "soon", title: "Однорідні й неоднорідні означення", href: "urok-odnoridni-neodnoridni.html"},
        {icon: "У", status: "soon", title: "Узагальнювальні слова в реченнях з однорідними членами", href: "urok-uzagalnyuvalni-slova.html"},
        {icon: "Т", status: "soon", title: "Типові помилки під час побудови речень з однорідними членами", href: "urok-typovi-pomylky-odnoridni.html"}
      ]},
      { title: "Речення із звертаннями, вставними словами", items: [
        {icon: "З", status: "soon", title: "Звертання", href: "urok-zvertannya.html"},
        {icon: "В", status: "soon", title: "Вставні слова (сполучення слів, речення)", href: "urok-vstavni-slova.html"},
        {icon: "У", status: "soon", title: "Узагальнення: «Однорідні члени» та «Звертання, вставні слова»", href: "urok-uzagalnennya-zvertannya-vstavni.html"}
      ]},
      { title: "Речення з відокремленими членами", items: [
        {icon: "В", status: "soon", title: "Відокремлені означення", href: "urok-vidokremleni-oznachennya.html"},
        {icon: "В", status: "soon", title: "Відокремлені прикладки", href: "urok-vidokremleni-prykladky.html"},
        {icon: "В", status: "soon", title: "Відокремлені обставини", href: "urok-vidokremleni-obstavyny.html"},
        {icon: "В", status: "soon", title: "Відокремлені додатки", href: "urok-vidokremleni-dodatky.html"},
        {icon: "В", status: "soon", title: "Відокремлені уточнювальні члени речення", href: "urok-vidokremleni-utochnyuvalni.html"},
        {icon: "У", status: "soon", title: "Узагальнення: «Речення з відокремленими членами»", href: "urok-uzagalnennya-vidokremleni.html"}
      ]}
    ]
  },
  {
    name: "Узагальнення та систематизація вивченого",
    subgroups: [
      { title: null, items: [
        {icon: "С", status: "soon", title: "Словосполучення і речення. Члени речення. Типи речень", href: "urok-uzagalnennya-slovospoluchennya-chleny-typy.html"},
        {icon: "Р", status: "soon", title: "Розділові знаки в простому ускладненому реченні", href: "urok-rozdilovi-znaky-uskladnene.html"}
      ]}
    ]
  }
];

const blocksEl = document.getElementById('blocks');

blocksEl.innerHTML = BLOCKS.map(block => `
  <div class="block">
    <h2 class="block-title">${block.name}</h2>
    ${block.subgroups.map(sg => `
      <div class="subgroup">
        ${sg.title ? `<div class="subgroup-title">${sg.title}</div>` : ''}
        <div class="grid">
          ${sg.items.map(it => `
            <a class="card ${it.status}" data-title="${it.title.toLowerCase()}" href="${it.status==='soon'?'#':it.href}">
              <div class="card-top">
                <span class="tile">${it.icon}</span>
                <span class="status ${it.status}">${it.status==='soon'?'Скоро':'Готово'}</span>
              </div>
              <p class="card-title">${it.title}</p>
              ${it.desc?`<p class="card-sub">${it.desc}</p>`:''}
            </a>`).join('')}
        </div>
      </div>
    `).join('')}
  </div>
`).join('');

document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.card').forEach(card=>{
    card.classList.toggle('hidden', q && !card.dataset.title.includes(q));
  });
  document.querySelectorAll('.subgroup').forEach(sg=>{
    const anyVisible = [...sg.querySelectorAll('.card')].some(c=>!c.classList.contains('hidden'));
    sg.style.display = anyVisible ? '' : 'none';
  });
  document.querySelectorAll('.block').forEach(b=>{
    const anyVisible = [...b.querySelectorAll('.card')].some(c=>!c.classList.contains('hidden'));
    b.style.display = anyVisible ? '' : 'none';
  });
});
</script>
</body>
</html>
